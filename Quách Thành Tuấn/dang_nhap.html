<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Tài Khoản</title>
    <link rel="stylesheet" href="./access/css/dang_nhap.css">
</head>
<body>
    
    <div class="card-dangnhap">

        <h2> Đăng Nhập Tài Khoản</h2>

        <form id="loginForm" class="dang_nhap">

            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập" required>

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>

            <div class="nut">
                <input class="dangnhap" type="submit" value="Đăng nhập">
            </div>

        </form>

        <p class="chua_taikhoan">
            Nếu bạn đã có tài khoản, <a href="./trangdangki.html">Đăng Ký tại đây</a>
        </p>

    </div>

    <script src="./access/js/trang_dangnhap.js"></script>
</body>
</html>
