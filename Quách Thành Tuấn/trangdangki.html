<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Kí | Đăng Nhập</title>
    <!-- thêm bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./access/css/trang_dang_ki.css">
</head>
<body>
    
    <div class="card-dangki">

        <h2>📝 Đăng Ký Tài Khoản</h2>

        <form id="registerForm" class="dang_ki">

            <label for="username">Tên đăng ký</label>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập">

            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu">

            <label for="confirm_password">Xác nhận mật khẩu</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Nhập lại mật khẩu">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="example@gmail.com">

            <div class="nut">
                <input class="dangki" type="submit" value="Đăng Ký">
            </div>

        </form>

    </div>

    <script src="./access/js/gtrang_dang_ki.js"></script>
</body>
</html>
